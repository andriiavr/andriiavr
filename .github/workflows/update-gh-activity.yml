name: update-gh-activity

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;

            const { data: events } =
              await github.rest.activity.listPublicEventsForUser({
                username: owner,
                per_page: 100
              });

            const labels = {
              PushEvent: "Pushed commits to",
              WatchEvent: "Starred",
              CreateEvent: "Created a repository or branch in"
            };

            const activity = events
              .filter(event => labels[event.type])
              .slice(0, 5)
              .map(event =>
                `- ${labels[event.type]} [${event.repo.name}](https://github.com/${event.repo.name})`
              )
              .join("\n") || "No recent public activity.";

            const { data: file } = await github.rest.repos.getContent({
              owner,
              repo,
              path: "README.md"
            });

            const readme = Buffer.from(file.content, "base64").toString("utf8");
            const section = /<!--START_SECTION:activity-->[\s\S]*?<!--END_SECTION:activity-->/;

            if (!section.test(readme)) {
              throw new Error("Activity markers are missing from README.md");
            }

            const updated = readme.replace(section, () =>
              `<!--START_SECTION:activity-->\n${activity}\n<!--END_SECTION:activity-->`
            );

            if (updated === readme) {
              core.info("Activity is already up to date.");
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: "README.md",
              message: "Update recent GitHub activity",
              content: Buffer.from(updated).toString("base64"),
              sha: file.sha
            });